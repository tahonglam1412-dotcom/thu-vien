<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện Lớp 7A1</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=1920') no-repeat center center fixed;
            background-size: cover; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        header {
            width: 100%; background: rgba(255, 255, 255, 0.95); padding: 15px 30px; display: flex;
            justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        header h1 { color: #2c3e50; font-size: 24px; font-weight: 800; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 15px; flex-wrap: wrap; }
        .lvl-badge { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #000; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; }
        .title-badge { background: #34495e; color: white; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .btn { background: #2980b9; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn:hover { background: #1f3a60; transform: translateY(-2px); }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-purple { background: #9b59b6; }
        .btn-purple:hover { background: #8e44ad; }
        .container { width: 95%; max-width: 1200px; margin: 30px 0; background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .screen { display: none; }
        .screen.active { display: block; }
        .auth-form { max-width: 420px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { background: #eee; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #555; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .filter-buttons { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #4a5568; }
        .filter-btn.active { background: #2980b9; color: white; }
        .story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .story-card { background: #fdfefe; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s; }
        .story-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .story-card h3 { color: #2c3e50; margin: 10px 0; font-size: 17px; min-height: 42px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .badges-wrapper { display: flex; gap: 5px; margin-bottom: 5px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; color: white; font-weight: bold;}
        .tag-vanhoc { background: #e67e22; }
        .tag-lichsu { background: #27ae60; }
        .tag-doisong { background: #2980b9; }
        .tag-cotich { background: #9b59b6; }
        .tag-length { background: #7f8c8d; }
        .story-content { font-size: 18px; line-height: 1.9; margin: 25px 0; max-height: 500px; overflow-y: auto; padding-right: 15px; text-align: justify; border-bottom: 2px solid #eee; }
        .quiz-section { background: #f8fafc; border: 2px solid #cbd5e1; padding: 20px; border-radius: 12px; margin-top: 25px; }
        .quiz-option { background: white; border: 1px solid #cbd5e1; padding: 12px 20px; border-radius: 8px; margin: 10px 0; cursor: pointer; transition: 0.2s; }
        .quiz-option:hover { background: #e2e8f0; }
        .wheel-container { text-align: center; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 500px; margin: 20px auto; }
        .wheel-graphic { width: 250px; height: 250px; border: 10px solid #2c3e50; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; background: conic-gradient(#e74c3c 0% 25%, #f1c40f 25% 50%, #2ecc71 50% 75%, #3498db 75% 100%); transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: inset 0 0 20px rgba(0,0,0,0.3); color: white; text-shadow: 1px 1px 3px black; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .leaderboard-table th, .leaderboard-table td { padding: 14px; text-align: left; border-bottom: 1px solid #ddd; }
        .leaderboard-table th { background: #2c3e50; color: white; }
        .rank-1 { background: #fff9db !important; }
        .rank-2 { background: #f1f5f9 !important; }
        .rank-3 { background: #fef2f2 !important; }
    </style>
</head>
<body>

    <header>
        <h1>📖 Đọc Truyện Lớp 7A1</h1>
        <div class="user-info" id="header-user-info"></div>
    </header>

    <div class="container">
        <div id="screen-login" class="screen active">
            <div class="auth-form">
                <h2>Đăng Nhập Học Sinh</h2>
                <div class="form-group">
                    <label>Tên đăng nhập:</label>
                    <input type="text" id="login-username" placeholder="Nhập tên đăng nhập...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="btn" style="width:100%" onclick="handleLogin()">Đăng Nhập</button>
                <p style="text-align:center; margin-top:15px;">Chưa có tài khoản? <span style="color:#2980b9; cursor:pointer; font-weight:bold;" onclick="switchScreen('screen-register')">Đăng ký tại đây</span></p>
            </div>
        </div>

        <div id="screen-register" class="screen">
            <div class="auth-form">
                <h2>Đăng Ký Thành Viên</h2>
                <div class="form-group">
                    <label>Họ và Tên học sinh:</label>
                    <input type="text" id="reg-name" placeholder="Ví dụ: Nguyễn Văn Hải">
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập tự chọn (viết liền):</label>
                    <input type="text" id="reg-username" placeholder="Ví dụ: vanhai">
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="reg-password" placeholder="Tạo mật khẩu...">
                </div>
                <button class="btn btn-success" style="width:100%" onclick="handleRegister()">Tạo Tài Khoản</button>
                <p style="text-align:center; margin-top:15px;">Đã có tài khoản? <span style="color:#2980b9; cursor:pointer; font-weight:bold;" onclick="switchScreen('screen-login')">Đăng nhập</span></p>
            </div>
        </div>

        <div id="screen-main" class="screen">
            <div class="tabs">
                <button class="tab-btn active" id="btn-tab-stories" onclick="showTab('stories')">📚 Kho Kiến Thức & Tác Phẩm</button>
                <button class="tab-btn" id="btn-tab-game" onclick="showTab('game')">🎡 Vòng Quay May Mắn</button>
                <button class="tab-btn" id="btn-tab-leaderboard" onclick="showTab('leaderboard')">🏆 Bảng Vàng Lớp Chi Tiết</button>
            </div>

            <div id="tab-stories" class="tab-content">
                <div class="filter-buttons">
                    <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">Tất Cả</button>
                    <button class="filter-btn" id="filter-vanhoc" onclick="setFilter('vanhoc')">📕 Ngữ Văn</button>
                    <button class="filter-btn" id="filter-lichsu" onclick="setFilter('lichsu')">⚔️ Lịch Sử Việt Nam</button>
                    <button class="filter-btn" id="filter-doisong" onclick="setFilter('doisong')">🌱 Quà Tặng Cuộc Sống</button>
                    <button class="filter-btn" id="filter-cotich" onclick="setFilter('cotich')">✨ Cổ Tích Chọn Lọc</button>
                    <button class="filter-btn" id="filter-short" onclick="setFilter('short')">⚡ Truyện Ngắn</button>
                    <button class="filter-btn" id="filter-long" onclick="setFilter('long')">⏳ Truyện Dài</button>
                </div>
                <div class="story-grid" id="story-list"></div>
            </div>

            <div id="tab-game" class="tab-content" style="display:none;">
                <div class="wheel-container">
                    <h2>🎡 VÒNG QUAY TRÍ TUỆ</h2>
                    <p style="margin-top:5px; color:#555;">Mỗi lượt quay tốn <strong>15 Điểm</strong>.</p>
                    <div class="wheel-graphic" id="wheel">🎁 QUÀ</div>
                    <button class="btn btn-purple" style="font-size:16px; padding:12px 30px;" onclick="spinWheel()">Bắt Đầu Quay (-15đ)</button>
                </div>
            </div>

            <div id="tab-leaderboard" class="tab-content" style="display:none;">
                <h2>🏆 BẢNG VÀNG THI ĐUÂNĂM HỌC TRỰC TUYẾN</h2>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Hạng</th>
                            <th>Học Sinh</th>
                            <th>Cấp Độ</th>
                            <th>Danh Hiệu</th>
                            <th>Số Bài Đã Đọc</th>
                            <th>Tổng Điểm</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
        </div>

        <div id="screen-read" class="screen">
            <button class="btn" onclick="backToMain()">⬅ Trở về kho truyện</button>
            <h2 id="read-title" style="margin-top:20px; color:#2c3e50;"></h2>
            <div class="story-content" id="read-content"></div>
            <div class="quiz-section" id="quiz-area"></div>
        </div>
    </div>

    <script>
        // --- LIÊN KẾT DATABASE FIREBASE CỦA EM ---
        try {
            firebase.initializeApp({ databaseURL: "https://thu-vien-86357-default-rtdb.firebaseio.com/" });
        } catch(e) { console.log("Firebase init error"); }

        // --- KHO TRUYỆN SẠCH CHỮ LỚP 9 ---
        const STORIES = [
            { id: 1, tag: "vanhoc", len: "long", tagName: "Ngữ Văn", lenName: "Truyện Dài", title: "Lặng Lẽ Sa Pa (Nguyễn Thành Long)", summary: "Bức tranh về những con người lao động thầm lặng, cống hiến hết mình cho tổ quốc giữa Sa Pa mù sương.", content: "Truyện ngắn 'Lặng lẽ Sa Pa' xoay quanh nhân vật anh thanh niên 27 tuổi làm công tác khí tượng kiêm vật lý địa cầu trên đỉnh Yên Sơn cao 2600 mét. Công việc hàng ngày của anh là đo gió, đo mưa, đo tính mây, đo chấn động đất rồi báo về trung tâm để phục vụ sản xuất và chiến đấu. Giữa cái lặng lẽ, heo hút của núi rừng Tây Bắc, anh vượt lên hoàn cảnh bằng lòng yêu nghề, lối sống khoa học, tinh thần ham đọc sách và sự cởi mở, chân thành. Cuộc gặp gỡ chớp nhoáng giữa anh với ông họa sĩ già và cô kỹ sư trẻ đã giúp họ cảm nhận sâu sắc hơn về vẻ đẹp của những con người cống hiến thầm lặng không tên tuổi cho đất nước.", quiz: { question: "Nhân vật anh thanh niên trong truyện sống và làm việc trên đỉnh núi nào?", options: ["Đỉnh Fansipan", "Đỉnh Yên Sơn", "Đỉnh Tây Côn Lĩnh"], correct: 1 } },
            { id: 2, tag: "vanhoc", len: "long", tagName: "Ngữ Văn", lenName: "Truyện Dài", title: "Chiếc Lược Ngà (Nguyễn Quang Sáng)", summary: "Câu chuyện cảm động rơi nước mắt về tình cha con thiêng liêng trong bom đạn kháng chiến chống Mỹ.", content: "Ông Sáu đi kháng chiến khi con gái là bé Thu chưa đầy một tuổi. Sau 8 năm xa cách, ông được về thăm nhà vài ngày nhưng trớ trêu thay, bé Thu không chịu nhận cha vì vết sẹo trên mặt khiến ông không giống người trong bức ảnh chụp chung với mẹ. Đến lúc em hiểu ra và cất tiếng gọi 'Ba' xé lòng thì cũng là lúc ông Sáu phải lên đường trở lại chiến trường. Tại căn cứ, ông dồn hết tình thương yêu vào việc làm một chiếc lược bằng ngà voi để tặng con. Trong một trận càn quét dữ dội của địch, ông Sáu đã hy sinh anh dũng trước khi kịp trao tận tay món quà cho con gái, nhưng tình cha con của ông thì mãi mãi bất diệt.", quiz: { question: "Tại sao ban đầu bé Thu nhất quyết không chịu nhận ông Sáu là cha?", options: ["Vì ông Sáu đi lâu quá em không nhớ mặt", "Vì vết sẹo trên mặt khiến ông khác với bức ảnh", "Vì em nghe lời kẻ xấu xúi giục"], correct: 1 } },
            { id: 3, tag: "vanhoc", len: "short", tagName: "Ngữ Văn", lenName: "Truyện Ngắn", title: "Làng (Kim Lân)", summary: "Tình yêu làng chợ dầu hòa quyện sâu sắc vào lòng yêu nước thiêng liêng của người nông dân tản cư.", content: "Nhân vật chính của tác phẩm là ông Hai - một người nông dân mang tình yêu làng Chợ Dầu sâu đậm. Phải đi tản cư vì chiến tranh, ông luôn dõi theo tin tức kháng chiến và tự hào về làng mình. Khi nghe tin sét đánh rằng làng Chợ Dầu theo giặc làm việt gian, ông Hai rơi vào tâm trạng đau đớn, tủi nhục, tuyệt vọng và bế tắc tuyệt đối. Thế nhưng, khi đặt lên bàn cân, ông khẳng định: 'Làng thì yêu thật, nhưng làng theo Tây thì phải thù'. Nỗi đau đó chỉ được giải tỏa hoàn toàn khi chủ tịch xã cải chính tin đồn. Dù nhà bị Tây đốt nhẵn, ông Hai vẫn sung sướng đi khoe khắp nơi vì đó là minh chứng làng ông không hề phản bội cách mạng.", quiz: { question: "Câu nói nổi tiếng nào thể hiện rõ nét nhận thức kháng chiến của ông Hai?", options: ["Làng thì yêu thật, nhưng làng theo Tây thì phải thù", "Dù có chết tôi cũng không bao giờ rời bỏ làng Chợ Dầu", "Tây đốt nhà tôi chứng tỏ làng tôi là làng cách mạng"], correct: 0 } }
        ];

        const types = ["vanhoc", "lichsu", "doisong", "cotich"];
        const names = {
            "vanhoc": ["Truyện Kiều Chuyên Sâu", "Đồng Chí - Chính Hữu", "Bài Thơ Tiểu Đội Xe Không Kính", "Ánh Trăng", "Mùa Xuân Nho Nhỏ", "Viếng Lăng Bác"],
            "lichsu": ["Chiến Thắng Điện Biên Phủ", "Hội Nghị Diên Hồng Kiên Cường", "Lý Thường Kiệt Phá Tống", "Chiến Thắng Bạch Đằng Giang"],
            "doisong": ["Hạt Giống Tâm Hồn: Cho Đi Là Còn Mãi", "Sức Mạnh Của Sự Tử Tế", "Vượt Qua Nghịch Cảnh Học Đường", "Tình Bạn Tuổi Học Trò"],
            "cotich": ["Tấm Cám Nguyên Tác", "Sự Tích Dưa Hấu Mai An Tiêm", "Bánh Chưng Bánh Giầy", "Sự Tích Hồ Gươm"]
        };
        
        let currentId = 4;
        for (let i = 1; i <= 30; i++) {
            let t = types[i % types.length];
            let titleList = names[t];
            STORIES.push({
                id: currentId, tag: t, len: (i % 2 === 0) ? "long" : "short",
                tagName: t === "vanhoc" ? "Ngữ Văn" : (t === "lichsu" ? "Lịch Sử" : (t === "doisong" ? "Đời Sống" : "Cổ Tích")),
                lenName: (i % 2 === 0) ? "Truyện Dài" : "Truyện Ngắn",
                title: titleList[i % titleList.length] + ` (Bài Số #${currentId})`,
                summary: `Tìm hiểu nội dung kiến thức chuyên sâu mở rộng bổ ích.`,
                content: `Chào mừng các em học sinh đến với hệ thống bài đọc hiểu chuyên sâu số #${currentId}. Tìm hiểu phong cách sáng tác độc đáo của các nhà văn hiện đại, sự kết hợp nhuần nhuyễn giữa chất trữ tình và chất hiện thực đời sống chiến đấu gian khổ của quân dân ta. Hãy ghi nhớ kỹ luận điểm cốt lõi này.\n\nMở rộng kiến thức nâng cao tại phần 2: Tìm hiểu phong cách sáng tác độc đáo của các nhà văn hiện đại, sự kết hợp nhuần nhuyễn giữa chất trữ tình và chất hiện thực đời sống chiến đấu gian khổ của quân dân ta. Từ đó xây dựng sơ đồ tư duy liên hệ thực tiễn một cách logic.\n\nĐúc kết và tổng hợp lại toàn bộ bài học: Tìm hiểu phong cách sáng tác độc đáo của các nhà văn hiện đại, sự kết hợp nhuần nhuyễn giữa chất trữ tình và chất hiện thực đời sống chiến đấu gian khổ của quân dân ta. Chúc các em vận dụng linh hoạt để đạt điểm tối đa trong các bài kiểm tra.`,
                quiz: { question: "Phương pháp học tốt nhất tác phẩm này là gì?", options: ["Nắm vững sơ đồ tư duy và luận điểm cốt lõi", "Học thuộc lòng không cần hiểu", "Bỏ qua các bài mở rộng"], correct: 0 }
            });
            currentId++;
        }

        // --- TRẠNG THÁI ---
        let currentUser = null;
        let activeStory = null;
        let currentFilter = 'all';

        function getLocalUsers() { return JSON.parse(localStorage.getItem('backup_users_l9')) || []; }
        function saveLocalUsers(arr) { localStorage.setItem('backup_users_l9', JSON.stringify(arr)); }

        window.onload = function() {
            let saved = localStorage.getItem('current_user_l9');
            if(saved) {
                currentUser = JSON.parse(saved);
                showMainScreen();
            }
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showTab(tabName) {
            document.getElementById('tab-stories').style.display = tabName === 'stories' ? 'block' : 'none';
            document.getElementById('tab-game').style.display = tabName === 'game' ? 'block' : 'none';
            document.getElementById('tab-leaderboard').style.display = tabName === 'leaderboard' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-tab-' + tabName).classList.add('active');
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filter-' + filterType).classList.add('active');
            renderStories();
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            if(!name || !username || !password) { alert("Hãy điền đủ thông tin em nhé!"); return; }

            const newUser = { username, password, name, points: 30, level: 1, readStories: [0] };
            let localUsers = getLocalUsers();
            if(localUsers.some(u => u.username === username)) { alert("Tên đăng nhập này đã tồn tại!"); return; }
            localUsers.push(newUser);
            saveLocalUsers(localUsers);

            try { firebase.database().ref('users/' + username).set(newUser); } catch(e){}
            alert("Đăng ký thành công!");
            switchScreen('screen-login');
            document.getElementById('login-username').value = username;
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            if(!username || !password) { alert("Vui lòng điền đủ thông tin!"); return; }

            try {
                firebase.database().ref('users/' + username).once('value').then((snapshot) => {
                    if(snapshot.exists() && snapshot.val().password === password) {
                        loginSuccess(snapshot.val());
                    } else { checkLocalLogin(username, password); }
                }).catch(() => { checkLocalLogin(username, password); });
            } catch(e) { checkLocalLogin(username, password); }
        }

        function checkLocalLogin(username, password) {
            let localUsers = getLocalUsers();
            let matched = localUsers.find(u => u.username === username && u.password === password);
            if(matched) { loginSuccess(matched); } else { alert("Sai tên đăng nhập hoặc mật khẩu!"); }
        }

        function loginSuccess(userObj) {
            currentUser = userObj;
            localStorage.setItem('current_user_l9', JSON.stringify(currentUser));
            showMainScreen();
        }

        function showMainScreen() {
            switchScreen('screen-main');
            updateHeaderUI();
            renderStories();
            syncLeaderboard(); // Tự động kích hoạt lắng nghe real-time từ bạn bè
        }

        function updateHeaderUI() {
            if(!currentUser) return;
            let titleName = "Tân Binh";
            if(currentUser.points >= 150) titleName = "Trạng Nguyên";
            else if(currentUser.points >= 100) titleName = "Bảng Nhãn";
            else if(currentUser.points >= 50) titleName = "Thám Hoa";

            let countRead = currentUser.readStories ? currentUser.readStories.filter(id => id !== 0).length : 0;
            document.getElementById('header-user-info').innerHTML = `
                <span>Học sinh: <strong>${currentUser.name}</strong></span>
                <span class="lvl-badge">Cấp ${currentUser.level}</span>
                <span class="title-badge">${titleName}</span>
                <span>Đã đọc: <strong>${countRead} bài</strong></span>
                <span>Điểm: <strong style="color:#e67e22;">${currentUser.points}đ</strong></span>
                <button class="btn btn-danger" style="padding:4px 10px; font-size:12px;" onclick="handleLogout()">Thoát</button>
            `;
        }

        function handleLogout() {
            localStorage.removeItem('current_user_l9');
            currentUser = null;
            switchScreen('screen-login');
        }

        function saveUserData() {
            localStorage.setItem('current_user_l9', JSON.stringify(currentUser));
            let arr = getLocalUsers();
            let idx = arr.findIndex(u => u.username === currentUser.username);
            if(idx !== -1) arr[idx] = currentUser; else arr.push(currentUser);
            saveLocalUsers(arr);
            try { firebase.database().ref('users/' + currentUser.username).set(currentUser); } catch(e){}
            updateHeaderUI();
        }

        function renderStories() {
            const container = document.getElementById('story-list');
            container.innerHTML = "";
            let list = STORIES;
            if (currentFilter !== 'all') {
                if (['vanhoc','lichsu','doisong','cotich'].includes(currentFilter)) list = STORIES.filter(s => s.tag === currentFilter);
                else list = STORIES.filter(s => s.len === currentFilter);
            }
            list.forEach(story => {
                let isRead = currentUser.readStories && currentUser.readStories.includes(story.id);
                const card = document.createElement('div');
                card.className = "story-card";
                card.innerHTML = `
                    <div>
                        <div class="badges-wrapper"><span class="badge tag-${story.tag}">${story.tagName}</span><span class="badge tag-length">${story.lenName}</span></div>
                        <h3>${story.title}</h3><p style="font-size:13px; color:#666;">${story.summary}</p>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        ${isRead ? `<span style="color:#2ecc71; font-weight:bold; font-size:12px;">✓ Đã xong</span>` : ""}
                        <button class="btn" style="padding:6px 14px; font-size:13px;" onclick="readStory(${story.id})">Nghiên Cứu Ngay</button>
                    </div>`;
                container.appendChild(card);
            });
        }

        function readStory(id) {
            activeStory = STORIES.find(s => s.id === id);
            if(!activeStory) return;
            switchScreen('screen-read');
            document.getElementById('read-title').innerText = activeStory.title;
            
            // Xử lý xuống dòng mượt mà cho nội dung truyện
            document.getElementById('read-content').innerHTML = activeStory.content.replace(/\n/g, '<br>');
            
            let isRead = currentUser.readStories && currentUser.readStories.includes(activeStory.id);
            const quizArea = document.getElementById('quiz-area');
            if(isRead) {
                quizArea.innerHTML = `<h3>🎉 Em đã hoàn thành tốt nội dung bài học này!</h3>`;
            } else {
                quizArea.innerHTML = `<h3 style="color:#c0392b; margin-bottom: 10px;">🧠 TRÒ CHƠI ĐỐ VUI</h3><p style="font-weight:bold; margin-bottom: 10px;">${activeStory.quiz.question}</p><div id="quiz-options-container"></div>`;
                activeStory.quiz.options.forEach((opt, idx) => {
                    const btn = document.createElement('div'); btn.className = "quiz-option"; btn.innerText = opt;
                    btn.onclick = function() {
                        if(idx === activeStory.quiz.correct) {
                            confetti({ particleCount: 80, spread: 60 });
                            currentUser.points += 10;
                            if(!currentUser.readStories) currentUser.readStories = [0];
                            currentUser.readStories.push(activeStory.id);
                            currentUser.level = Math.floor(currentUser.points / 50) + 1;
                            saveUserData();
                            alert("Chính xác! Bạn được cộng +10 điểm.");
                            readStory(activeStory.id);
                        } else { alert("Chưa chính xác rồi, hãy suy nghĩ lại nhé!"); }
                    };
                    document.getElementById('quiz-options-container').appendChild(btn);
                });
            }
        }

        function backToMain() { activeStory = null; showMainScreen(); }

        let spinning = false;
        function spinWheel() {
            if(spinning) return;
            if(currentUser.points < 15) { alert("Không đủ 15 điểm!"); return; }
            spinning = true;
            currentUser.points -= 15;
            updateHeaderUI();
            let gifts = [{n:"Mất lượt rồi 😢", b:0, d:45},{n:"+5 Điểm 🌟", b:5, d:135},{n:"+20 Điểm 🚀", b:20, d:225},{n:"+50 Điểm 🎁", b:50, d:315}];
            let lucky = gifts[Math.floor(Math.random()*gifts.length)];
            document.getElementById('wheel').style.transform = `rotate(${3600 + lucky.d}deg)`;
            setTimeout(() => {
                spinning = false;
                currentUser.points += lucky.b;
                currentUser.level = Math.floor(currentUser.points / 50) + 1;
                saveUserData();
                alert("Kết quả: " + lucky.n);
            }, 4000);
        }

        // --- BẢNG XẾP HẠNG (ĐỒNG BỘ TRỰC TIẾP LIVE 24/7) ---
        function syncLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            let showList = function(arr) {
                arr.sort((a,b) => b.points - a.points);
                tbody.innerHTML = "";
                arr.forEach((u, i) => {
                    let tr = document.createElement('tr');
                    if(i===0) tr.className="rank-1"; else if(i===1) tr.className="rank-2"; else if(i===2) tr.className="rank-3";
                    let count = u.readStories ? u.readStories.filter(id=>id!==0).length : 0;
                    let titleName = "Học Viên";
                    if(u.points >= 150) titleName = "👑 Trạng Nguyên";
                    else if(u.points >= 100) titleName = "Bảng Nhãn";
                    else if(u.points >= 50) titleName = "Thám Hoa";

                    tr.innerHTML = `<td>#${i+1}</td><td><strong>${u.name}</strong> (@${u.username})</td><td>Cấp ${u.level || 1}</td><td><span class="title-badge">${titleName}</span></td><td>${count} bài</td><td><strong style="color:#e67e22;">${u.points}đ</strong></td>`;
                    tbody.appendChild(tr);
                });
            };

            try {
                // Sử dụng .on('value') để liên tục cập nhật khi có bạn bè cộng điểm
                firebase.database().ref('users').on('value', function(snap) {
                    if(snap.exists()) {
                        showList(Object.values(snap.val()));
                    } else { showList(getLocalUsers()); }
                }, function() { showList(getLocalUsers()); });
            } catch(e) { showList(getLocalUsers()); }
        }
    </script>
</body>
</html>
